- name: Setup network devices
  become: true
  hosts: spines:leafs
  roles:
    - frr

- name: Setup server
  become: true
  hosts: servers
  roles:
    - server

# We don't check host connection because the interface facing the hosts
# is considered as a bridge interface
- name: Test P2P direct neighbor
  become: true
  hosts: spines:leafs
  tasks:
    - name: Ping P2P direct neighbor
      ansible.builtin.command:
        cmd: "ping -c 3 {{item.ip}}"
      loop: "{{ neighbors }}"
      loop_control:
        label: "{{ inventory_hostname }} <--> {{ item.name }}({{ item.ip }})"
      when: type != "server" and hostvars[item.name]["type"] != "server"
      register: p2p_ping_results
      changed_when: false
      failed_when: false

    - name: Display ping results
      ansible.builtin.debug:
        msg: >-
          {{ 'SUCCESS' if item.rc == 0 else 'FAIL' }}
          {% if item.rc == 1 %}
          (host: {{ item.item.name }}, ip: {{ item.item.ip }})
          {% endif %}
      loop: "{{ p2p_ping_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not (item.skipped | default(false))

- name: Test overlay configuration
  become: true
  hosts: leafs
  tasks:
    - name: Ping VTEP neighbors
      ansible.builtin.command:
        cmd: "ping -I {{ loopback }} -c 3 {{ hostvars[item]['loopback'] }}"
      loop: "{{ groups['leafs']}}"
      loop_control:
        label: "{{ item }}"
      when: inventory_hostname != item
      register: vtep_ping_results
      changed_when: false
      failed_when: false

    - name: Display ping results
      ansible.builtin.debug:
        msg: >-
          {{ 'SUCCESS' if item.rc == 0 else 'FAIL' }}
          {% if item.rc == 1 %}
          (host: {{ item.item }}, ip: {{ hostvars[item.item]['loopback'] }})
          {% endif %}
      loop: "{{ vtep_ping_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: not (item.skipped | default(false))
